[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "douyin-media-extractor"
version = "1.0.0"
description = "A small, security-conscious Douyin video and MP3 extractor"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "Flask>=3.0,<4",
  "yt-dlp>=2025.1.15",
]

[project.scripts]
douyin-extract = "douyin_extractor.cli:main"
douyin-extract-web = "douyin_extractor.web:main"

[tool.setuptools.package-data]
douyin_extractor = ["templates/*.html"]
